<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Cameras</title>
<style>
  /* Plain look: black background, big white words, yellow for the picked button.
     Made to be read at a glance, from across a room if need be. */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #000; color: #fff;
    font-family: Arial, Helvetica, sans-serif; height: 100%; }
  /* The page is a full-height column: the top bar and the status line
     take the height they need, and the grid takes ALL the rest, so no
     black space is ever left under the tiles. */
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    overflow: hidden; }
  #topbar, #status { flex: 0 0 auto; }
  /* One top bar: count buttons on the left, pick boxes on the right.
     It may wrap onto two lines on a narrow screen; the grid below
     still takes all the leftover height either way. */
  #topbar { padding: 10px 12px; background: #111; display: flex;
    flex-wrap: wrap; align-items: flex-start; }
  #topbar .barright { margin-left: auto; }
  #topbar .howmany { font-size: 26px; font-weight: bold; margin: 0 10px 8px 0;
    display: inline-block; vertical-align: middle; }
  .countbtn { font-size: 26px; font-weight: bold; min-width: 64px; min-height: 56px;
    margin: 0 6px 8px 0; padding: 8px 14px; border: 3px solid #fff; border-radius: 10px;
    background: #222; color: #fff; cursor: pointer; }
  .countbtn.picked { background: #ffd400; color: #000; border-color: #ffd400; }
  /* The pick boxes: one big tick box per camera, numbered 1 to 10,
     sitting in the top bar to the right of the count buttons.
     The whole label is the tap target, so a finger cannot miss. */
  #topbar .pickwords { font-size: 26px; font-weight: bold; margin: 0 10px 8px 0;
    display: inline-block; vertical-align: middle; }
  .pickbox { display: inline-block; vertical-align: middle; margin: 0 4px 8px 0;
    padding: 6px 10px 6px 6px; border: 3px solid #fff; border-radius: 10px;
    background: #222; color: #fff; font-size: 26px; font-weight: bold;
    cursor: pointer; }
  .pickbox input { width: 34px; height: 34px; margin: 0 6px 0 2px;
    vertical-align: middle; cursor: pointer; accent-color: #ffd400; }
  .pickbox.off { border-color: #666; color: #999; background: #161616; }
  /* Shown in the grid area when every box is unticked. */
  #emptymsg { display: none; flex: 1 1 auto; align-items: center;
    justify-content: center; text-align: center; font-size: 30px;
    font-weight: bold; color: #ffd400; padding: 20px; }
  #status { font-size: 22px; padding: 8px 12px; color: #ffd400; background: #000; }
  /* flex: 1 makes the grid fill the leftover screen height; the 1fr
     rows split that height evenly, and the tiles stretch to fill
     their row — the pictures inside crop to fit (object-fit: cover). */
  #grid { display: grid; gap: 6px; padding: 6px; flex: 1 1 auto;
    min-height: 0; grid-auto-rows: 1fr; }
  .tile { position: relative; background: #1a1a1a; border: 2px solid #444;
    overflow: hidden; cursor: pointer; }
  .tile video, .tile canvas { position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block; }
  .tile .camname { position: absolute; top: 0; left: 0; z-index: 3;
    background: rgba(0,0,0,0.75); color: #fff; font-size: 24px; font-weight: bold;
    padding: 4px 12px; border-bottom-right-radius: 8px; }
  .tile .demotext { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    background: rgba(0,0,0,0.75); color: #ffd400; font-size: 22px; font-weight: bold;
    text-align: center; padding: 6px 4px; }
  .tile .bigwords { position: absolute; inset: 0; z-index: 2; display: flex;
    align-items: center; justify-content: center; text-align: center;
    font-size: 24px; font-weight: bold; color: #fff; padding: 10px; }
  /* One tile picked big: the rest are hidden hard (!important beats the
     inline display the layout code sets), so the big tile is the only
     one laid out — it takes the grid's single full-height row and
     fills the screen exactly, with no sliver of another tile showing. */
  #grid.onebig .tile { display: none !important; }
  #grid.onebig .tile.big { display: block !important; }
  /* The pick number rides as its own span so the phone rules below
     can print it inside the box; on ordinary screens it just sits
     beside the box as before. */
  .pickbox .num { display: inline-block; vertical-align: middle; }

  /* ---- Phone widths (up to 600px): the whole top bar on ONE line ----
     Everything shrinks: the word labels go away (the numbers carry
     the meaning), the count buttons become small chips, and each
     pick box is a 22px square with its number printed inside it —
     a yellow square means ticked, a dark square means not.
     The sizes add up at 360px wide: count buttons 113px (five
     one-digit chips at 17px, the "10" chip at 23px, five 1px gaps),
     pick boxes 229px (ten 22px squares, nine 1px gaps), bar side
     padding 6px — 348px in all, inside the 360px screen. */
  @media (max-width: 600px) {
    #topbar { flex-wrap: nowrap; align-items: center; padding: 6px 3px; }
    #topbar .howmany, #topbar .pickwords { display: none; }
    #buttons { display: inline-flex; gap: 1px; }
    #boxes { display: inline-flex; gap: 1px; }
    .countbtn { font-size: 11px; min-width: 0; min-height: 34px;
      margin: 0; padding: 3px; border-width: 2px; border-radius: 7px; }
    .pickbox { position: relative; margin: 0; padding: 5px 0;
      border: none; background: none; font-size: 11px; }
    .pickbox.off { background: none; }
    .pickbox input { appearance: none; -webkit-appearance: none;
      display: block; width: 22px; height: 22px; margin: 0;
      border: 2px solid #fff; border-radius: 6px; background: #222; }
    .pickbox input:checked { background: #ffd400; border-color: #ffd400; }
    .pickbox .num { position: absolute; left: 0; top: 5px; width: 22px;
      height: 22px; line-height: 22px; text-align: center;
      font-size: 11px; pointer-events: none; color: #fff; }
    .pickbox input:checked ~ .num { color: #000; }
    #status { font-size: 16px; padding: 6px 8px; }
    #emptymsg { font-size: 20px; }
    .tile .camname { font-size: 15px; padding: 3px 8px; }
    .tile .demotext { font-size: 13px; padding: 4px 2px; }
    .tile .bigwords { font-size: 16px; }
  }

  /* ---- Very wide screens (TV, 1800px and up): a step larger ---- */
  @media (min-width: 1800px) {
    #topbar .howmany, #topbar .pickwords { font-size: 32px; }
    .countbtn { font-size: 32px; min-width: 76px; min-height: 68px;
      padding: 10px 18px; }
    .pickbox { font-size: 32px; padding: 8px 12px 8px 8px; }
    .pickbox input { width: 42px; height: 42px; }
    #status { font-size: 27px; }
    #emptymsg { font-size: 36px; }
    .tile .camname { font-size: 29px; }
    .tile .demotext { font-size: 26px; }
    .tile .bigwords { font-size: 29px; }
  }
</style>
</head>
<body>

<div id="topbar">
  <div class="barleft">
    <span class="howmany">Cameras on screen:</span>
    <span id="buttons"></span>
  </div>
  <div class="barright">
    <span class="pickwords">Show:</span>
    <span id="boxes"></span>
  </div>
</div>
<div id="status">Loading…</div>
<div id="emptymsg">No cameras picked — tick a box in the top bar.</div>
<div id="grid"></div>

<script>
/* ================================================================
   SETTINGS — the ONE place the at-home addresses go.
   When the cameras are joined up at the house, only this block
   changes. Nothing below it needs touching.
   ----------------------------------------------------------------
   DEMO_MODE: true  = the tiles show a test picture (no cameras).
              false = the tiles show the real cameras.
   TRANSLATOR_ADDRESS: where the go2rtc translator program lives
              on the home network (the program running on the home
              PC that turns the recorder's streams into web streams).
   STREAMS: camera name on the left, the stream name the translator
              knows it by on the right.
   ================================================================ */
const SETTINGS = {
  DEMO_MODE: true,
  TRANSLATOR_ADDRESS: "http://192.168.1.50:1984",
  STREAMS: {
    "Camera 1":  "camera1",
    "Camera 2":  "camera2",
    "Camera 3":  "camera3",
    "Camera 4":  "camera4",
    "Camera 5":  "camera5",
    "Camera 6":  "camera6",
    "Camera 7":  "camera7",
    "Camera 8":  "camera8",
    "Camera 9":  "camera9",
    "Camera 10": "camera10"
  }
};
/* ==================== end of SETTINGS ==================== */

/* ----------------------------------------------------------------
   What the player code assumes (go2rtc shape):
   - go2rtc serves each stream for web browsers at its address,
     port 1984.
   - A browser picture is opened by sending a WebRTC offer to
     POST  {TRANSLATOR_ADDRESS}/api/webrtc?src={stream name}
     with the offer text as the body; go2rtc sends back an answer
     and the picture follows. (That is go2rtc's own web-player way
     of working, the same road its built-in stream.html page uses.)
   - Tiles show the sub (small) picture in the grid where the
     translator offers one under the name "<stream>_sub"; if not,
     the main stream is used. This test copy keeps it simple and
     uses the stream named in SETTINGS for every tile.
   ---------------------------------------------------------------- */

const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const buttonsEl = document.getElementById('buttons');
const boxesEl = document.getElementById('boxes');
const emptyEl = document.getElementById('emptymsg');
const COUNTS = [1, 2, 4, 6, 8, 10];
const camNames = Object.keys(SETTINGS.STREAMS);
/* picked[i] is true when camera i+1's box is ticked. All ten start
   ticked, so the page opens showing every camera. */
const picked = camNames.map(() => true);
let showing = 10;        // how many tiles are on screen right now
let bigTile = null;      // the tile element picked big, or null
const players = {};      // camName -> {pc} live WebRTC connections

function columnsFor(count) {
  const wide = window.innerWidth >= window.innerHeight;
  if (count <= 1) return 1;
  if (count === 2) return wide ? 2 : 1;
  if (count === 3) return wide ? 3 : 2;
  if (count === 4) return 2;
  if (count === 5) return wide ? 3 : 2;
  if (count === 6) return wide ? 3 : 2;
  if (count === 7) return wide ? 4 : 2;
  if (count === 8) return wide ? 4 : 2;
  if (count === 9) return 3;
  if (count === 10) return wide ? 5 : 2;
  return 2;
}

function sayWords() {
  if (showing === 0) {
    statusEl.textContent = 'No cameras picked — tick a box in the top bar.';
  } else if (bigTile) {
    statusEl.textContent = 'One camera, big. Tap the picture to go back to all cameras.';
  } else {
    statusEl.textContent = 'Showing ' + showing + (showing === 1 ? ' camera' : ' cameras') +
      '. Tap a picture to make it big.';
  }
}

/* --- demo picture: moving bars on a canvas, plainly marked --- */
function startDemo(canvas, index) {
  const ctx = canvas.getContext('2d');
  const hue = (index * 36) % 360;
  let t = index * 20;
  function frame() {
    const w = canvas.width = canvas.clientWidth || 320;
    const h = canvas.height = canvas.clientHeight || 180;
    ctx.fillStyle = 'hsl(' + hue + ', 60%, 22%)';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'hsl(' + hue + ', 80%, 45%)';
    const bw = 60;
    for (let x = -h; x < w + h; x += bw * 2) {
      ctx.beginPath();
      const off = (t * 2) % (bw * 2);
      ctx.moveTo(x + off, h);
      ctx.lineTo(x + off + bw, h);
      ctx.lineTo(x + off + bw + h, 0);
      ctx.lineTo(x + off + h, 0);
      ctx.fill();
    }
    // a sweeping second hand, so the eye can tell the picture moves
    const cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.28;
    const a = (t * 0.02) % (Math.PI * 2);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a)); ctx.stroke();
    t++;
    if (canvas.isConnected) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* --- live picture: one WebRTC talk to the translator program --- */
async function startLive(video, streamName) {
  const pc = new RTCPeerConnection({ iceServers: [] });
  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.addTransceiver('audio', { direction: 'recvonly' });
  pc.ontrack = (ev) => { video.srcObject = ev.streams[0]; };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  const url = SETTINGS.TRANSLATOR_ADDRESS + '/api/webrtc?src=' +
    encodeURIComponent(streamName);
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/sdp' },
    body: offer.sdp
  });
  if (!resp.ok) throw new Error('translator said no');
  const answer = await resp.text();
  await pc.setRemoteDescription({ type: 'answer', sdp: answer });
  return pc;
}

function buildTiles() {
  grid.innerHTML = '';
  for (const name of camNames) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.cam = name;

    const label = document.createElement('div');
    label.className = 'camname';
    label.textContent = name;
    tile.appendChild(label);

    if (SETTINGS.DEMO_MODE) {
      const canvas = document.createElement('canvas');
      tile.appendChild(canvas);
      const demo = document.createElement('div');
      demo.className = 'demotext';
      demo.textContent = 'Test picture — no camera joined yet';
      tile.appendChild(demo);
      requestAnimationFrame(() => startDemo(canvas, camNames.indexOf(name)));
    } else {
      const video = document.createElement('video');
      video.autoplay = true; video.muted = true; video.playsInline = true;
      tile.appendChild(video);
      const wait = document.createElement('div');
      wait.className = 'bigwords';
      wait.textContent = 'Joining the camera…';
      tile.appendChild(wait);
      startLive(video, SETTINGS.STREAMS[name])
        .then((pc) => { players[name] = pc; wait.remove(); })
        .catch(() => {
          wait.textContent = 'No picture. The translator program may be off.';
        });
    }

    tile.addEventListener('click', () => toggleBig(tile));
    grid.appendChild(tile);
  }
}

function layOut() {
  showing = picked.filter(Boolean).length;
  grid.classList.toggle('onebig', !!bigTile);
  grid.style.gridTemplateColumns = bigTile
    ? '1fr' : 'repeat(' + columnsFor(Math.max(showing, 1)) + ', 1fr)';
  /* No cameras picked: plain words in the grid's place, not black. */
  grid.style.display = showing === 0 ? 'none' : '';
  emptyEl.style.display = showing === 0 ? 'flex' : 'none';
  for (const tile of grid.children) {
    const idx = camNames.indexOf(tile.dataset.cam);
    tile.classList.toggle('big', tile === bigTile);
    tile.style.display = (bigTile || picked[idx]) ? 'block' : 'none';
  }
  sayWords();
}

function toggleBig(tile) {
  bigTile = (bigTile === tile) ? null : tile;
  layOut();
}

/* The count buttons are a quick set: tapping one ticks the first
   that-many boxes and unticks the rest. After any change, a count
   button lights up only when the ticked boxes are exactly the
   first that-many cameras. */
function syncCountButtons() {
  for (const b of buttonsEl.children) {
    const n = Number(b.dataset.n);
    let match = true;
    for (let i = 0; i < picked.length; i++) {
      if (picked[i] !== (i < n)) { match = false; break; }
    }
    b.classList.toggle('picked', match);
  }
}

function syncBoxLook() {
  for (const label of boxesEl.children) {
    const input = label.querySelector('input');
    label.classList.toggle('off', !input.checked);
  }
}

function buildButtons() {
  for (const n of COUNTS) {
    const b = document.createElement('button');
    b.className = 'countbtn';
    b.dataset.n = n;
    b.textContent = n;
    b.addEventListener('click', () => {
      for (let i = 0; i < picked.length; i++) {
        picked[i] = i < n;
        boxesEl.children[i].querySelector('input').checked = picked[i];
      }
      bigTile = null;
      syncBoxLook();
      syncCountButtons();
      layOut();
    });
    buttonsEl.appendChild(b);
  }
}

/* One tick box per camera, numbered 1 to 10, all ticked at first.
   Ticking or unticking swaps which cameras show; the grid keeps
   camera-number order whatever the mix. */
function buildBoxes() {
  camNames.forEach((name, i) => {
    const label = document.createElement('label');
    label.className = 'pickbox';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = true;
    input.setAttribute('aria-label', name);
    input.addEventListener('change', () => {
      picked[i] = input.checked;
      bigTile = null;
      syncBoxLook();
      syncCountButtons();
      layOut();
    });
    label.appendChild(input);
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(i + 1);
    label.appendChild(num);
    boxesEl.appendChild(label);
  });
}

window.addEventListener('resize', layOut);
buildBoxes();
buildButtons();
buildTiles();
syncBoxLook();
syncCountButtons();
layOut();
</script>
</body>
</html>
