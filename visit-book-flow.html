<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Visit Book — how a picture is taken and told</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #14161a;
    color: #f2f2ee;
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    padding: 14px 16px 6px;
    text-align: center;
  }
  header h1 {
    font-size: clamp(20px, 4.5vw, 32px);
    margin: 0 0 4px;
    font-weight: bold;
  }
  header p {
    margin: 0;
    font-size: clamp(14px, 3vw, 17px);
    color: #c9c9c2;
  }
  .bar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    padding: 10px;
    background: #14161a;
    border-bottom: 1px solid #3a3d44;
  }
  .bar button {
    font-size: 20px;
    font-family: inherit;
    min-width: 52px;
    min-height: 48px;
    padding: 6px 14px;
    border-radius: 10px;
    border: 2px solid #f2f2ee;
    background: #23262c;
    color: #f2f2ee;
    cursor: pointer;
  }
  .bar button:active { background: #3a3d44; }
  .bar span {
    font-size: 17px;
    min-width: 58px;
    text-align: center;
  }
  #stage {
    overflow: auto;
    padding: 10px 4px 30px;
  }
  svg {
    display: block;
    margin: 0 auto;
    background: #1b1e24;
    border-radius: 12px;
  }
  .box { fill: #fdfdf8; stroke: #111; stroke-width: 2.5; }
  .term { fill: #ffe9a8; stroke: #111; stroke-width: 2.5; }
  .dia { fill: #d9ecff; stroke: #111; stroke-width: 2.5; }
  .conn { fill: #fdfdf8; stroke: #111; stroke-width: 2.5; }
  .ln { stroke: #f2f2ee; stroke-width: 2.5; fill: none; }
  .t { fill: #111; font-size: 16px; text-anchor: middle; }
  .tb { fill: #111; font-size: 16px; font-weight: bold; text-anchor: middle; }
  .lab { fill: #ffd76a; font-size: 14.5px; font-weight: bold; }
  .note { fill: #c9c9c2; font-size: 13.5px; font-style: italic; text-anchor: middle; }
  .connT { fill: #111; font-size: 15px; font-weight: bold; text-anchor: middle; }
  .dot { fill: #f2f2ee; }
</style>
</head>
<body>
<header>
  <h1>The Visit Book — how a picture is taken and told</h1>
  <p>Use the buttons to make the chart bigger or smaller. You can also pinch to zoom.</p>
</header>
<div class="bar">
  <button id="zout" aria-label="Make smaller">&minus;</button>
  <span id="zpct">100%</span>
  <button id="zin" aria-label="Make bigger">+</button>
  <button id="zfit">Fit</button>
</div>
<div id="stage">
<svg id="chart" viewBox="0 0 780 1560" width="780" height="1560" role="img" aria-label="Flow chart: how a picture is taken and told in the Visit Book">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2f2ee"></path>
    </marker>
  </defs>

  <!-- 1. START -->
  <rect class="term" x="120" y="30" width="340" height="56" rx="28"></rect>
  <text class="tb" x="290" y="55">START</text>
  <text class="t" x="290" y="75">The guest holds the tablet</text>
  <line class="ln" x1="290" y1="86" x2="290" y2="112" marker-end="url(#arr)"></line>

  <!-- connector A (top): the road back to step 2 -->
  <circle class="conn" cx="64" cy="148" r="15"></circle>
  <text class="connT" x="64" y="153">A</text>
  <line class="ln" x1="79" y1="148" x2="116" y2="148" marker-end="url(#arr)"></line>

  <!-- 2. Take a Picture -->
  <rect class="box" x="120" y="116" width="340" height="64"></rect>
  <text class="t" x="290" y="142">Guest taps the big button:</text>
  <text class="tb" x="290" y="164">Take a Picture</text>
  <line class="ln" x1="290" y1="180" x2="290" y2="206" marker-end="url(#arr)"></line>

  <!-- 3. Camera opens -->
  <rect class="box" x="120" y="210" width="340" height="56"></rect>
  <text class="t" x="290" y="244">The camera opens inside the book</text>
  <line class="ln" x1="290" y1="266" x2="290" y2="292" marker-end="url(#arr)"></line>

  <!-- 4. Guest takes the picture -->
  <rect class="box" x="120" y="296" width="340" height="56"></rect>
  <text class="t" x="290" y="330">Guest takes the picture</text>
  <line class="ln" x1="290" y1="352" x2="290" y2="378" marker-end="url(#arr)"></line>

  <!-- 5. The book offers the place -->
  <rect class="box" x="120" y="382" width="340" height="64"></rect>
  <text class="t" x="290" y="408">The book offers the place</text>
  <text class="t" x="290" y="430">it thinks this is</text>
  <line class="ln" x1="290" y1="446" x2="290" y2="472" marker-end="url(#arr)"></line>

  <!-- 6. Is the place right? -->
  <polygon class="dia" points="290,476 440,536 290,596 140,536"></polygon>
  <text class="tb" x="290" y="542">Is the place right?</text>
  <!-- No: to the side box -->
  <line class="ln" x1="440" y1="536" x2="496" y2="536" marker-end="url(#arr)"></line>
  <text class="lab" x="468" y="524" text-anchor="middle">No</text>
  <rect class="box" x="500" y="492" width="240" height="88"></rect>
  <text class="t" x="620" y="528">Guest picks the right</text>
  <text class="t" x="620" y="550">place from the list</text>
  <line class="ln" x1="620" y1="580" x2="620" y2="640"></line>
  <line class="ln" x1="620" y1="640" x2="294" y2="640"></line>
  <!-- Yes: straight down, joining the side road at the dot -->
  <line class="ln" x1="290" y1="596" x2="290" y2="702" marker-end="url(#arr)"></line>
  <circle class="dot" cx="290" cy="640" r="4.5"></circle>
  <text class="lab" x="302" y="622">Yes</text>

  <!-- 7. How will you tell it? -->
  <polygon class="dia" points="290,706 440,766 290,826 140,766"></polygon>
  <text class="tb" x="290" y="772">How will you tell it?</text>
  <!-- Write: to the side box -->
  <line class="ln" x1="440" y1="766" x2="496" y2="766" marker-end="url(#arr)"></line>
  <text class="lab" x="468" y="754" text-anchor="middle">Write</text>
  <rect class="box" x="500" y="736" width="240" height="60"></rect>
  <text class="t" x="620" y="772">Guest types the words</text>
  <!-- Write road: down the right side, into the save box -->
  <line class="ln" x1="620" y1="796" x2="620" y2="1272"></line>
  <line class="ln" x1="620" y1="1272" x2="464" y2="1272" marker-end="url(#arr)"></line>
  <!-- Talk: straight down -->
  <line class="ln" x1="290" y1="826" x2="290" y2="852" marker-end="url(#arr)"></line>
  <text class="lab" x="302" y="846">Talk</text>

  <!-- 8. Record the voice -->
  <rect class="box" x="120" y="856" width="340" height="64"></rect>
  <text class="t" x="290" y="882">Guest speaks; the book</text>
  <text class="t" x="290" y="904">records the voice</text>
  <!-- the say-it-again loop comes back into this box from the left -->
  <line class="ln" x1="64" y1="888" x2="116" y2="888" marker-end="url(#arr)"></line>
  <line class="ln" x1="290" y1="920" x2="290" y2="946" marker-end="url(#arr)"></line>

  <!-- 9. Voice into words -->
  <rect class="box" x="120" y="950" width="340" height="64"></rect>
  <text class="t" x="290" y="976">The book turns the voice</text>
  <text class="t" x="290" y="998">into words and shows them</text>
  <line class="ln" x1="290" y1="1014" x2="290" y2="1022"></line>
  <text class="note" x="290" y="1042">If the tablet cannot make the words, the voice is saved</text>
  <text class="note" x="290" y="1060">and the words are made later from the saved voice.</text>
  <line class="ln" x1="290" y1="1070" x2="290" y2="1092" marker-end="url(#arr)"></line>

  <!-- 10. Keep it? -->
  <polygon class="dia" points="290,1096 430,1151 290,1206 150,1151"></polygon>
  <text class="tb" x="290" y="1157">Keep it?</text>
  <!-- No: loop back up the left side to the record box -->
  <line class="ln" x1="150" y1="1151" x2="64" y2="1151"></line>
  <line class="ln" x1="64" y1="1151" x2="64" y2="888"></line>
  <text class="lab" transform="rotate(-90 46 1020)" x="46" y="1020" text-anchor="middle">No — say it again</text>
  <!-- Yes: down -->
  <line class="ln" x1="290" y1="1206" x2="290" y2="1236" marker-end="url(#arr)"></line>
  <text class="lab" x="302" y="1228">Yes</text>

  <!-- 11. Saved together (the Write road joins here, from the right) -->
  <rect class="box" x="120" y="1240" width="340" height="64"></rect>
  <text class="t" x="290" y="1266">Picture, place, and tale are saved</text>
  <text class="t" x="290" y="1288">together in the book</text>
  <line class="ln" x1="290" y1="1304" x2="290" y2="1330" marker-end="url(#arr)"></line>

  <!-- 12. Another picture? -->
  <polygon class="dia" points="290,1334 430,1389 290,1444 150,1389"></polygon>
  <text class="tb" x="290" y="1395">Another picture?</text>
  <!-- Yes: left and down to connector A -->
  <line class="ln" x1="150" y1="1389" x2="64" y2="1389"></line>
  <line class="ln" x1="64" y1="1389" x2="64" y2="1455"></line>
  <text class="lab" x="107" y="1379" text-anchor="middle">Yes</text>
  <circle class="conn" cx="64" cy="1470" r="15"></circle>
  <text class="connT" x="64" y="1475">A</text>
  <!-- No: down to the one stop -->
  <line class="ln" x1="290" y1="1444" x2="290" y2="1472" marker-end="url(#arr)"></line>
  <text class="lab" x="302" y="1464">No</text>

  <!-- STOP 1: the one stop for the whole page -->
  <rect class="term" x="120" y="1476" width="340" height="56" rx="28"></rect>
  <text class="tb" x="290" y="1500">STOP 1</text>
  <text class="t" x="290" y="1520" font-size="14.5">The visit stands saved in the book</text>
</svg>
</div>
<script>
  var svg = document.getElementById('chart');
  var pct = document.getElementById('zpct');
  var stage = document.getElementById('stage');
  var z = 1;
  function setZ(nz) {
    z = Math.min(3, Math.max(0.3, nz));
    svg.style.width = (780 * z) + 'px';
    svg.style.height = (1560 * z) + 'px';
    pct.textContent = Math.round(z * 100) + '%';
  }
  function fit() {
    var w = stage.clientWidth - 12;
    setZ(Math.min(1.5, w / 780));
  }
  document.getElementById('zin').addEventListener('click', function () { setZ(z * 1.25); });
  document.getElementById('zout').addEventListener('click', function () { setZ(z / 1.25); });
  document.getElementById('zfit').addEventListener('click', fit);
  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
