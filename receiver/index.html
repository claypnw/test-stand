<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receiver — Yamaha RX-A6A</title>
<style>
  :root { --bg:#14161a; --panel:#1e2126; --line:#33373f; --text:#f2f3f5; --dim:#a7adb8; --gold:#d8a942; --red:#c0392b; --green:#3f9e4d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Georgia,'Times New Roman',serif; }
  .wrap { max-width:560px; margin:0 auto; padding:18px 16px 40px; }
  h1 { font-size:22px; margin:4px 0 2px; text-align:center; letter-spacing:.5px; }
  .sub { text-align:center; color:var(--dim); font-size:14px; margin-bottom:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 10px; color:var(--gold); letter-spacing:1px; text-transform:uppercase; }
  /* dial */
  .dialrow { display:flex; align-items:center; justify-content:center; gap:14px; }
  .stepbtn { width:58px; height:58px; border-radius:50%; border:2px solid var(--line); background:#262a31; color:var(--text); font-size:26px; cursor:pointer; }
  .stepbtn:active { background:#31363f; }
  .dialbox { text-align:center; }
  #dial { width:210px; height:210px; border-radius:50%; background:radial-gradient(circle at 50% 42%, #2c3038, #1a1d22 70%); border:3px solid var(--line); position:relative; cursor:grab; touch-action:none; margin:0 auto; }
  #dial:active { cursor:grabbing; }
  #needle { position:absolute; left:50%; top:50%; width:4px; height:86px; background:var(--gold); border-radius:2px; transform-origin:50% 100%; }
  #volnum { font-size:64px; line-height:1; margin-top:10px; }
  .vollabel { color:var(--dim); font-size:14px; }
  input[type=range] { width:100%; height:36px; accent-color:var(--gold); }
  .steprow { display:flex; justify-content:space-between; gap:8px; margin-top:6px; }
  .steprow button { flex:1; padding:10px 0; font-size:16px; border-radius:10px; border:1px solid var(--line); background:#262a31; color:var(--text); cursor:pointer; }
  /* buttons */
  .btnrow { display:flex; gap:10px; }
  .bigbtn { flex:1; padding:16px 0; font-size:18px; border-radius:12px; border:2px solid var(--line); background:#262a31; color:var(--text); cursor:pointer; }
  .bigbtn.on { border-color:var(--green); }
  .bigbtn.muted { border-color:var(--red); color:#ff9a8a; }
  .grid { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:10px 12px; font-size:15px; border-radius:999px; border:1px solid var(--line); background:#262a31; color:var(--text); cursor:pointer; }
  .chip.cur { border-color:var(--gold); color:var(--gold); }
  .tone { display:flex; align-items:center; gap:10px; margin:8px 0; }
  .tone .name { width:64px; color:var(--dim); }
  .tone .val { width:36px; text-align:center; font-size:18px; }
  .tone button { width:44px; height:44px; border-radius:10px; border:1px solid var(--line); background:#262a31; color:var(--text); font-size:20px; cursor:pointer; }
  #status { text-align:center; color:var(--dim); font-size:14px; min-height:20px; }
  .err { color:#ff9a8a !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Yamaha Receiver</h1>
  <div class="sub">Front room &middot; RX-A6A</div>

  <div class="card">
    <h2>Volume</h2>
    <div class="dialrow">
      <button class="stepbtn" id="vdown" aria-label="Volume down 5">&#8722;</button>
      <div class="dialbox">
        <div id="dial"><div id="needle"></div></div>
        <div id="volnum">&ndash;</div>
        <div class="vollabel">volume step &middot; 0 quiet &ndash; 161 loudest</div>
      </div>
      <button class="stepbtn" id="vup" aria-label="Volume up 5">+</button>
    </div>
    <input type="range" id="volslider" min="0" max="161" step="1" value="0">
    <div class="steprow">
      <button data-step="-5">&#8722; 5</button>
      <button data-step="-1">&#8722; 1</button>
      <button data-step="1">+ 1</button>
      <button data-step="5">+ 5</button>
    </div>
  </div>

  <div class="card">
    <h2>Power &amp; Mute</h2>
    <div class="btnrow">
      <button class="bigbtn" id="powerbtn">Power</button>
      <button class="bigbtn" id="mutebtn">Mute</button>
    </div>
  </div>

  <div class="card">
    <h2>Input</h2>
    <div class="grid" id="inputs"></div>
  </div>

  <div class="card">
    <h2>Sound Program</h2>
    <div class="grid" id="programs"></div>
  </div>

  <div class="card">
    <h2>Tone</h2>
    <div class="tone"><span class="name">Bass</span><button data-tone="bass:-1">&#8722;</button><span class="val" id="bassval">&ndash;</span><button data-tone="bass:1">+</button></div>
    <div class="tone"><span class="name">Treble</span><button data-tone="treble:-1">&#8722;</button><span class="val" id="trebleval">&ndash;</span><button data-tone="treble:1">+</button></div>
  </div>

  <div id="status">Asking the receiver&hellip;</div>
</div>

<script>
const DEMO = true; // the test-stand preview copy runs with DEMO = true (pretend receiver)
const API = '/api';
const INPUTS = [
  ['tv','TV'],['hdmi1','HDMI 1'],['hdmi2','HDMI 2'],['hdmi3','HDMI 3'],['hdmi4','HDMI 4'],['hdmi5','HDMI 5'],['hdmi6','HDMI 6'],['hdmi7','HDMI 7'],
  ['bluetooth','Bluetooth'],['airplay','AirPlay'],['spotify','Spotify'],['amazon_music','Amazon Music'],['net_radio','Net Radio'],['tuner','Tuner'],
  ['usb','USB'],['server','Server'],['phono','Phono'],['av1','AV 1'],['av2','AV 2'],['av3','AV 3'],
  ['audio1','Audio 1'],['audio2','Audio 2'],['audio3','Audio 3'],['audio4','Audio 4'],
  ['pandora','Pandora'],['tidal','Tidal'],['qobuz','Qobuz'],['deezer','Deezer'],['napster','Napster'],['siriusxm','SiriusXM'],['mc_link','MC Link']
];
const PROGRAMS = ['straight','surr_decoder','2ch_stereo','all_ch_stereo','standard','sci-fi','adventure','drama','spectacle','mono_movie','enhanced','music_video','recital_opera','sports','action_game','roleplaying_game','munich','vienna','amsterdam','freiburg','royaumont','chamber','village_vanguard','warehouse_loft','cellar_club','roxy_theatre','bottom_line'];
const pretty = s => s.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());

let state = { power:'on', volume:0, mute:false, input:'tv', sound_program:'straight', tone:{bass:0,treble:0} };
let demoState = { power:'on', volume:94, mute:false, input:'tv', sound_program:'straight', tone_control:{bass:10,treble:2} };

const $ = id => document.getElementById(id);
const inputsEl = $('inputs'), programsEl = $('programs');
INPUTS.forEach(([id,label]) => { const b = document.createElement('button'); b.className='chip'; b.textContent=label; b.dataset.input=id; b.onclick=()=>call('setInput?input='+id); inputsEl.appendChild(b); });
PROGRAMS.forEach(p => { const b = document.createElement('button'); b.className='chip'; b.textContent=pretty(p); b.dataset.prog=p; b.onclick=()=>call('setSoundProgram?program='+p); programsEl.appendChild(b); });

function render() {
  $('volnum').textContent = state.volume;
  if (document.activeElement !== $('volslider')) $('volslider').value = state.volume;
  const ang = -135 + (state.volume/161)*270;
  $('needle').style.transform = 'translate(-50%,-100%) rotate(' + ang + 'deg)';
  $('powerbtn').textContent = state.power === 'on' ? 'Power: On' : 'Power: Off';
  $('powerbtn').classList.toggle('on', state.power === 'on');
  $('mutebtn').textContent = state.mute ? 'Muted' : 'Mute';
  $('mutebtn').classList.toggle('muted', state.mute);
  document.querySelectorAll('#inputs .chip').forEach(c => c.classList.toggle('cur', c.dataset.input === state.input));
  document.querySelectorAll('#programs .chip').forEach(c => c.classList.toggle('cur', c.dataset.prog === state.sound_program));
  const t = state.tone_control || state.tone || {bass:0,treble:0};
  $('bassval').textContent = t.bass; $('trebleval').textContent = t.treble;
}
function note(msg, isErr) { const s = $('status'); s.textContent = msg; s.classList.toggle('err', !!isErr); }

async function refresh() {
  if (DEMO) { state = JSON.parse(JSON.stringify(demoState)); render(); return; }
  try {
    const r = await fetch(API + '/status'); if (!r.ok) throw new Error(r.status);
    state = await r.json(); render();
  } catch(e) { note('The receiver did not answer. Check that this page\u2019s program is running and the receiver is on the network.', true); }
}
async function call(path) {
  if (DEMO) {
    if (path.startsWith('setVolume')) demoState.volume = Math.max(0, Math.min(161, parseInt(path.split('=')[1])));
    else if (path.startsWith('setPower')) demoState.power = path.includes('standby') ? 'standby' : 'on';
    else if (path.startsWith('setMute')) demoState.mute = path.includes('true');
    else if (path.startsWith('setInput')) demoState.input = path.split('=')[1];
    else if (path.startsWith('setSoundProgram')) demoState.sound_program = path.split('=')[1];
    else if (path.startsWith('setToneControl')) { const q = new URLSearchParams(path.split('?')[1]); if (q.has('bass')) demoState.tone_control.bass = +q.get('bass'); if (q.has('treble')) demoState.tone_control.treble = +q.get('treble'); }
    state = JSON.parse(JSON.stringify(demoState)); render();
    note('Preview copy: pretend receiver set. The live page reads the real number back.');
    return;
  }
  try {
    const r = await fetch(API + '/' + path); const d = await r.json();
    if (d.response_code !== 0) throw new Error('receiver refused');
    await refresh();
    note('Receiver answered and confirmed.');
  } catch(e) { note('That control did not go through. Nothing was changed that I can see.', true); await refresh(); }
}

function setVol(v) { v = Math.max(0, Math.min(161, Math.round(v))); call('setVolume?volume=' + v); }
$('vup').onclick = () => setVol(state.volume + 5);
$('vdown').onclick = () => setVol(state.volume - 5);
document.querySelectorAll('.steprow button').forEach(b => b.onclick = () => setVol(state.volume + (+b.dataset.step)));
$('volslider').addEventListener('change', e => setVol(+e.target.value));
$('powerbtn').onclick = () => call('setPower?power=' + (state.power === 'on' ? 'standby' : 'on'));
$('mutebtn').onclick = () => call('setMute?enable=' + (!state.mute));
document.querySelectorAll('[data-tone]').forEach(b => b.onclick = () => {
  const [which, d] = b.dataset.tone.split(':'); const t = state.tone_control || state.tone;
  const cur = which === 'bass' ? t.bass : t.treble; const nv = Math.max(-12, Math.min(12, cur + (+d)));
  call('setToneControl?mode=manual&' + which + '=' + nv);
});

/* dial drag: vertical drag changes volume */
(() => {
  const dial = $('dial'); let startY = null, startV = 0;
  dial.addEventListener('pointerdown', e => { startY = e.clientY; startV = state.volume; dial.setPointerCapture(e.pointerId); });
  dial.addEventListener('pointermove', e => { if (startY === null) return; const dv = Math.round((startY - e.clientY) / 3); const v = Math.max(0, Math.min(161, startV + dv)); state.volume = v; render(); });
  dial.addEventListener('pointerup', e => { if (startY === null) return; const dv = Math.round((startY - e.clientY) / 3); startY = null; setVol(startV + dv); });
  dial.addEventListener('wheel', e => { e.preventDefault(); setVol(state.volume + (e.deltaY < 0 ? 1 : -1)); }, { passive:false });
})();

refresh();
setInterval(refresh, 8000);
</script>
</body>
</html>
