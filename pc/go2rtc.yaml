# ============================================================
#  HOUSE CAMERAS — settings for the translator program (go2rtc)
#
#  go2rtc is a small free program. It takes the picture streams
#  from your camera unit and hands them to your web browser,
#  which cannot take them straight.
#
#  This file is ready to use. Your unit's address
#  (192.168.7.194), the login name (admin), and the blank
#  password are already written into the ten stream lines
#  below. There is nothing to fill in and nothing to edit.
#
#  The ten lines use the first address form (port 554,
#  channels ch0 to ch9, main picture). If the one-click
#  test shows a different form is the road your unit
#  answers to, this file gets rewritten on Muggy's side
#  and you save the fresh copy — you never edit it.
# ============================================================

# The door the viewer page knocks on. Leave this as it is.
api:
  listen: ":1984"

streams:
  camera1:  rtsp://admin:@192.168.7.194:554/ch0/main
  camera2:  rtsp://admin:@192.168.7.194:554/ch1/main
  camera3:  rtsp://admin:@192.168.7.194:554/ch2/main
  camera4:  rtsp://admin:@192.168.7.194:554/ch3/main
  camera5:  rtsp://admin:@192.168.7.194:554/ch4/main
  camera6:  rtsp://admin:@192.168.7.194:554/ch5/main
  camera7:  rtsp://admin:@192.168.7.194:554/ch6/main
  camera8:  rtsp://admin:@192.168.7.194:554/ch7/main
  camera9:  rtsp://admin:@192.168.7.194:554/ch8/main
  camera10: rtsp://admin:@192.168.7.194:554/ch9/main
