# ============================================================
#  HOUSE CAMERAS — ONE-CLICK TEST settings for go2rtc
#
#  What this file is: the settings for a single TEST run of
#  the translator program (go2rtc). It is not the everyday
#  settings file — that is go2rtc.yaml, which stands in the
#  same folder.
#
#  What this test asks your camera unit, all in one run:
#
#    1. Is the unit's password still BLANK? Every line below
#       signs in as admin with a blank password. If the unit
#       answers any line with a picture, the blank password
#       is right. If every line answers 401 instead, a
#       password stands on the unit.
#
#    2. Which address form does the unit answer to? The
#       lines below try CAMERA 1 ONLY, once under each
#       address form your unit's family is known to use, in
#       the order the setup notes list them. The form that
#       brings a picture is the road; that same form then
#       gets used for all ten cameras in the everyday file.
#
#  The unit's address (192.168.7.194) and the blank password
#  are ALREADY filled in on every line. There is nothing to
#  change in this file.
#
#  How to run the test: double-click run-test.bat, which
#  stands in the same folder as this file.
# ============================================================

# The door the test page knocks on. Leave this as it is.
api:
  listen: ":1984"

streams:
  # Form 1 — port 554, channel counted from 0, main picture.
  test-form1: rtsp://admin:@192.168.7.194:554/ch0/main
  # Form 2 — channel counted from 1 in the last digits
  # (101 is camera 1, main picture).
  test-form2: rtsp://admin:@192.168.7.194:554/Streaming/Channels/101
  # Form 3 — short two-digit form, first spelling
  # (11 is camera 1).
  test-form3: rtsp://admin:@192.168.7.194:554/11
  # Form 3 again — the second spelling this family is also
  # seen with (01 is camera 1).
  test-form4: rtsp://admin:@192.168.7.194:554/01
  # Form 4 — the first form, but on port 80 instead of 554.
  test-form5: rtsp://admin:@192.168.7.194:80/ch0/main
